<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  :root{
    --gold:#b8860b; --gold2:#d4a017; --green:#15803d; --red:#dc2626;
    --bg:#f5f3ee; --card:#ffffff; --t:#1f2937; --t2:#4b5563; --t3:#9ca3af; --brd:#e5e7eb;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0f1115; --card:#1a1d24; --t:#f3f4f6; --t2:#cbd5e1; --t3:#6b7280; --brd:#2b2f3a; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;font-size:15px}
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  /* ── Login ── */
  .login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;gap:14px}
  .logo{font-size:2.1rem;font-weight:900;color:var(--gold);letter-spacing:.5px}
  .logo small{display:block;font-size:.8rem;color:var(--t3);font-weight:700;margin-top:4px}
  .lcard{background:var(--card);border:1px solid var(--brd);border-radius:18px;padding:22px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(0,0,0,.08)}
  .lcard h2{margin:0 0 4px;font-size:1.05rem;text-align:center}
  .lcard p{margin:0 0 16px;font-size:.78rem;color:var(--t3);text-align:center}
  label{display:block;font-size:.78rem;font-weight:800;color:var(--t2);margin:10px 2px 5px}
  input{width:100%;padding:.8rem;border-radius:12px;border:1.5px solid var(--brd);background:var(--bg);color:var(--t);font-family:inherit;font-size:1rem;font-weight:700;text-align:right;box-sizing:border-box}
  input:focus{outline:none;border-color:var(--gold)}
  .btn{width:100%;padding:.85rem;border:none;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;font-family:inherit;font-weight:900;font-size:1rem;cursor:pointer;margin-top:16px}
  .btn:active{transform:scale(.98)}
  .btn.sec{background:transparent;border:1.5px solid var(--brd);color:var(--t2)}
  .err{color:var(--red);font-size:.8rem;text-align:center;margin-top:10px;font-weight:700;min-height:1em}
  .hint{font-size:.68rem;color:var(--t3);text-align:center;margin-top:14px;line-height:1.7}
  /* ── Account ── */
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .top .tl{font-weight:900;color:var(--gold);font-size:1.05rem}
  .top button{background:transparent;border:1.5px solid var(--brd);border-radius:10px;color:var(--t2);font-family:inherit;font-weight:800;font-size:.75rem;padding:.4rem .7rem;cursor:pointer}
  .shop{background:var(--card);border:1px solid var(--brd);border-radius:18px;margin-bottom:16px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.05)}
  .shop-h{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;padding:14px 16px}
  .shop-h .nm{font-size:1.15rem;font-weight:900}
  .shop-h .sub{font-size:.72rem;opacity:.9;margin-top:2px}
  .bal{display:flex;gap:10px;padding:14px;flex-wrap:wrap}
  .balc{flex:1;min-width:130px;border-radius:14px;padding:12px;text-align:center;border:1.5px solid}
  .balc .lb{font-size:.72rem;font-weight:800;margin-bottom:3px}
  .balc .vv{font-size:1.3rem;font-weight:900;direction:ltr}
  .balc .st{font-size:.68rem;font-weight:800;margin-top:2px}
  .zero{background:rgba(148,163,184,.08);border-color:var(--brd)}
  .pos{background:rgba(220,38,38,.07);border-color:#fca5a5} /* عليك للمحل */
  .neg{background:rgba(21,128,61,.07);border-color:#86efac}  /* لك عند المحل */
  .pos .vv,.pos .st{color:#dc2626}
  .neg .vv,.neg .st{color:#15803d}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .pos .vv,:root:not([data-theme="light"]) .pos .st{color:#f87171}
    :root:not([data-theme="light"]) .neg .vv,:root:not([data-theme="light"]) .neg .st{color:#4ade80}
  }
  table{width:100%;border-collapse:collapse}
  thead tr{background:var(--bg)}
  th{font-size:.72rem;color:var(--t2);padding:.55rem .4rem;text-align:right;font-weight:800;position:sticky;top:0;background:var(--bg)}
  td{padding:.55rem .4rem;font-size:.78rem;border-bottom:1px solid var(--brd);vertical-align:top}
  .tscroll{max-height:62vh;overflow-y:auto}
  .op-nm{font-weight:800}
  .op-dt{font-size:.64rem;color:var(--t3);white-space:nowrap}
  .op-amt{font-weight:900;white-space:nowrap;direction:ltr}
  .det{font-size:.68rem;color:var(--t2);line-height:1.6}
  .det span{display:block}
  .empty{text-align:center;padding:30px;color:var(--t3);font-size:.85rem}
  .foot{text-align:center;font-size:.66rem;color:var(--t3);padding:16px 0}
  .spin{width:30px;height:30px;border:3px solid var(--brd);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin:40px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- شاشة الدخول -->
<div class="login" id="loginView">
  <div class="logo">GoldPro<small>بوابة الزبون — كشف الحساب</small></div>
  <div class="lcard">
    <h2>الدخول إلى حسابك</h2>
    <p>أدخل رقم هاتفك وكلمة السر التي أعطاك إياها المحل</p>
    <label>📱 رقم الهاتف</label>
    <input id="iPhone" type="tel" inputmode="numeric" placeholder="0xxxxxxxxx" dir="ltr" autocomplete="username">
    <label>🔑 كلمة السر</label>
    <input id="iPin" type="password" inputmode="numeric" placeholder="••••" dir="ltr" autocomplete="current-password">
    <button class="btn" id="btnLogin">عرض حسابي</button>
    <div class="err" id="loginErr"></div>
    <button class="btn sec" id="btnInstall2" style="margin-top:12px">📲 تثبيت التطبيق على هاتفك</button>
    <div class="hint">حسابك محمي — لا يراه إلا من يملك رقمك وكلمة سرّك.<br>كلمة السر تحصل عليها من المحل.</div>
  </div>
</div>

<!-- شاشة الحساب -->
<div class="wrap" id="acctView" style="display:none">
  <div class="top">
    <div class="tl">👤 <span id="custName">حسابي</span></div>
    <div style="display:flex;gap:6px">
      <button id="btnInstall" style="display:none;background:linear-gradient(135deg,#b8860b,#d4a017);color:#fff;border:none">📲 تثبيت</button>
      <button id="btnLogout">خروج</button>
    </div>
  </div>
  <div id="shops"></div>
  <div class="foot">GoldPro — بوابة الزبون · البيانات للعرض فقط</div>
</div>

<script>
/* ═══ Firebase ═══ */
var _cfg={
  apiKey:"AIzaSyCHFJl-U9gM1nZEjRo-F48_U_lo8kf-WDM",
  authDomain:"soge-d51a7.firebaseapp.com",
  databaseURL:"https://soge-d51a7-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"soge-d51a7",
  storageBucket:"soge-d51a7.firebasestorage.app",
  messagingSenderId:"612431442460",
  appId:"1:612431442460:web:dc7646b68c7652635ee5d9"
};
firebase.initializeApp(_cfg);
var _db=firebase.database();

/* 📲 التثبيت كتطبيق (PWA) */
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('portal-sw.js').catch(function(){}); }); }
var _deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); _deferredPrompt=e; var b=document.getElementById('btnInstall'); if(b)b.style.display='inline-block'; });
window.addEventListener('appinstalled',function(){ _deferredPrompt=null; var b=document.getElementById('btnInstall'); if(b)b.style.display='none'; });

/* ═══ أدوات ═══ */
var $=function(id){return document.getElementById(id);};
var normPhone=function(p){return String(p||'').replace(/[^0-9]/g,'');};
var normPin=function(p){return String(p||'').trim().replace(/[\/\.\#\$\[\]\s]/g,'');};
function fmtG(n){ /* بتر رقمين بلا تقريب */
  n=Number(n)||0; var neg=n<0,a=Math.abs(n);
  var s=a.toFixed(6),d=s.indexOf('.'),cut=s.slice(0,d+3);
  var p=cut.split('.'),i=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  return (neg?'−':'')+i+','+p[1];
}
function fmtD(n){ n=Math.round(Number(n)||0); var neg=n<0; return (neg?'−':'')+Math.abs(n).toLocaleString('fr-FR'); }

/* إعادة بناء تفاصيل العملية من الفاتورة (مبسّطة من opDetailLines) */
function opDetails(o,inv){
  var L=[], d=o.did&&inv?inv[o.did]:null, t=o.t||'';
  var isBuy=(t==='شراء سلعة'||t==='دفع دينار');
  if(d){
    var items=Array.isArray(d.items)?d.items:[];
    items.forEach(function(it){ if((it.w||0)>0.001) L.push('🛍️ '+(it.n||'سلعة')+' — '+fmtG(it.w)+'غ'); });
    if(d.rot&&(d.rot.eq>0.001)) L.push('↩️ روتور: '+fmtG(d.rot.eq)+'غ (705)');
    if(d.kass&&(d.kass.eq>0.001)) L.push('⚱️ '+(isBuy?'دفعت':'أخذت')+' لاكاص: '+fmtG(d.kass.eq)+'غ (705)');
    if(d.cashiCash&&((d.cashiCash.amt||0)>0.001)) L.push('💵 كاصي بالصوارد: '+fmtD(d.cashiCash.amt)+' دج ÷ '+fmtD(d.cashiCash.rate)+' = '+fmtG(d.cashiCash.eq)+'غ (705)');
    if(d.cashiFee&&((d.cashiFee.din||0)>0.001)) L.push('⚱️ أجرة بالكاصي: '+fmtD(d.cashiFee.din)+' دج');
    if(d.liveKassi&&((d.liveKassi.w||0)>0.001)) L.push('🔥 كاصي حي: '+fmtG(d.liveKassi.w)+'غ خام');
    if((d.cash||0)>0.001) L.push('💵 '+(isBuy?'دفعت لك':'قبضت منك')+': '+fmtD(d.cash)+' دج');
  }
  if(o.fee>0.001) L.push('💰 الأجرة: '+fmtD(o.fee)+' دج');
  if(o.note) L.push('📝 '+o.note);
  return L;
}
/* اسم العملية المعروض (مبسّط) */
function opName(o,inv){
  var t=o.t||'', d=o.did&&inv?inv[o.did]:null;
  var map={'بيع دولار':'سلعة','شراء دولار':'سلعة','قبض دينار':'دينار','دفع دينار':'دينار','أخذ دينار':'دينار'};
  if(d&&(t==='بيع سلعة'||t==='شراء سلعة'||t==='قبض دينار'||t==='دفع دينار')){
    var items=Array.isArray(d.items)?d.items:[];
    var goodsEq=items.reduce(function(s,it){return s+(((it.w||0)>0.001)?(Number(it.eq)||((it.w||0)*(it.k||705)/705)):0);},0)-((d.rot&&d.rot.eq)||0);
    if(goodsEq<=0.001){
      var c=[];
      if(d.kass&&d.kass.eq>0.001)c.push('لاكاص');
      if(d.cashiCash&&(d.cashiCash.amt||0)>0.001)c.push('كاصي بالصوارد');
      if(d.cashiFee&&d.cashiFee.eq>0.001)c.push('أجرة بالكاصي');
      if(d.liveKassi&&(d.liveKassi.w||0)>0.001)c.push('كاصي حي');
      if((d.cash||0)>0.001)c.push('دينار');
      if(c.length)return c.join(' + ');
    }
  }
  return map[t]||t||'عملية';
}
/* مبلغ العرض: المكافئ الذهبي إن وُجد في الفاتورة، وإلا المخزّن */
function opAmount(o,inv){
  var t=o.t||'', d=o.did&&inv?inv[o.did]:null;
  if(d&&(t==='بيع سلعة'||t==='شراء سلعة'||t==='قبض دينار'||t==='دفع دينار')){
    var items=Array.isArray(d.items)?d.items:[];
    var g=items.reduce(function(s,it){return s+(((it.w||0)>0.001)?(Number(it.eq)||((it.w||0)*(it.k||705)/705)):0);},0)-((d.rot&&d.rot.eq)||0);
    var comp=g
      +((d.kass&&d.kass.eq>0.001)?d.kass.eq:0)
      +((d.cashiFee&&d.cashiFee.eq>0.001)?d.cashiFee.eq:0)
      +((d.liveKassi&&(d.liveKassi.w||0)>0.001)?d.liveKassi.w:0)
      +((d.cashiCash&&(d.cashiCash.eq||0)>0.001)?d.cashiCash.eq:0);
    if(Math.abs(comp)>0.001) return {a:comp,unit:'غ'};
  }
  return {a:Number(o.a)||0, unit:(o.m==='دينار')?'دج':'غ'};
}

/* ═══ عرض الحساب ═══ */
function renderShops(data){
  var shops=$('shops'); shops.innerHTML='';
  var keys=Object.keys(data||{});
  if(!keys.length){ shops.innerHTML='<div class="empty">لا توجد بيانات لحسابك بعد.<br>اطلب من المحل تحديث حسابك.</div>'; return; }
  var firstName='';
  keys.forEach(function(sk){
    var p=data[sk]; if(!p)return;
    firstName=firstName||p.name||'';
    /* الرصيد من منظور الزبون: + للمحل = عليك · − للمحل = لك */
    var gold=Number(p.gold)||0, din=Number(p.din)||0;
    var gCls=Math.abs(gold)<0.001?'zero':(gold>0?'pos':'neg');
    var gSt =Math.abs(gold)<0.001?'—':(gold>0?'عليك للمحل':'لك عند المحل');
    var dCls=Math.abs(din)<0.001?'zero':(din>0?'pos':'neg');
    var dSt =Math.abs(din)<0.001?'—':(din>0?'عليك للمحل':'لك عند المحل');
    var upd=p.upd?new Date(p.upd).toLocaleString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'';
    var inv=p.inv||{};
    var ops=(p.ops||[]).slice().sort(function(a,b){return (b._ts||0)-(a._ts||0);});

    var rows=ops.map(function(o){
      var nm=opName(o,inv), am=opAmount(o,inv);
      var dl=opDetails(o,inv);
      var det=dl.length?('<div class="det">'+dl.map(function(x){return '<span>'+esc(x)+'</span>';}).join('')+'</div>'):'';
      var amStr=(am.unit==='دج'?fmtD(am.a):fmtG(am.a))+' '+am.unit;
      return '<tr><td class="op-dt">'+esc(o.dt||'')+'</td>'+
             '<td class="op-nm">'+esc(nm)+'</td>'+
             '<td class="op-amt">'+esc(amStr)+'</td>'+
             '<td>'+det+'</td></tr>';
    }).join('');
    if(!rows) rows='<tr><td colspan="4" class="empty">لا توجد معاملات</td></tr>';

    var html='<div class="shop">'+
      '<div class="shop-h"><div class="nm">🏪 '+esc(p.shop||sk)+'</div>'+(upd?'<div class="sub">آخر تحديث: '+esc(upd)+'</div>':'')+'</div>'+
      '<div class="bal">'+
        '<div class="balc '+gCls+'"><div class="lb">الذهب (705)</div><div class="vv">'+fmtG(Math.abs(gold))+' غ</div><div class="st">'+gSt+'</div></div>'+
        '<div class="balc '+dCls+'"><div class="lb">الدينار</div><div class="vv">'+fmtD(Math.abs(din))+' دج</div><div class="st">'+dSt+'</div></div>'+
      '</div>'+
      '<div class="tscroll"><table><thead><tr><th>التاريخ</th><th>النوع</th><th>المبلغ</th><th>التفاصيل</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '</div>';
    shops.insertAdjacentHTML('beforeend',html);
  });
  $('custName').textContent=firstName||'حسابي';
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* ═══ الدخول ═══ */
function doLogin(ph,pin,remember){
  var err=$('loginErr'); err.textContent='';
  $('shops').innerHTML='<div class="spin"></div>';
  $('loginView').style.display='none'; $('acctView').style.display='block';
  _db.ref('goldpro/portal/'+ph+'/'+pin).once('value').then(function(sn){
    var data=sn.val();
    if(!data){
      $('acctView').style.display='none'; $('loginView').style.display='flex';
      err.textContent='لا يوجد حساب بهذا الرقم وكلمة السر. تأكد منهما أو راجع المحل.';
      return;
    }
    if(remember){ try{localStorage.setItem('gp_portal_login',JSON.stringify({ph:ph,pin:pin}));}catch(e){} }
    renderShops(data);
    /* تحديث حيّ */
    _db.ref('goldpro/portal/'+ph+'/'+pin).on('value',function(s){ var v=s.val(); if(v)renderShops(v); });
  }).catch(function(e){
    $('acctView').style.display='none'; $('loginView').style.display='flex';
    err.textContent='تعذّر الاتصال. تحقق من الإنترنت وحاول مجدداً.';
  });
}
$('btnLogin').onclick=function(){
  var ph=normPhone($('iPhone').value), pin=normPin($('iPin').value);
  if(ph.length<8){$('loginErr').textContent='أدخل رقم هاتف صحيح';return;}
  if(pin.length<4){$('loginErr').textContent='أدخل كلمة السر';return;}
  doLogin(ph,pin,true);
};
$('iPin').addEventListener('keydown',function(e){ if(e.key==='Enter')$('btnLogin').click(); });
function _doInstall(){
  if(_deferredPrompt){ _deferredPrompt.prompt(); _deferredPrompt.userChoice.finally(function(){ _deferredPrompt=null; var b=$('btnInstall'); if(b)b.style.display='none'; }); }
  else{ alert('لتثبيت التطبيق:\n• أندرويد/كروم: قائمة المتصفح ⋮ ← «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».\n• آيفون/سفاري: زر المشاركة ⬆️ ← «إضافة إلى الشاشة الرئيسية».'); }
}
$('btnInstall').onclick=_doInstall;
$('btnInstall2').onclick=_doInstall;
$('btnLogout').onclick=function(){
  try{localStorage.removeItem('gp_portal_login');}catch(e){}
  try{_db.ref().off();}catch(e){}
  $('acctView').style.display='none'; $('loginView').style.display='flex';
  $('iPin').value='';
};
/* استعادة جلسة سابقة + دعم رابط ?c=phone&p=pin */
(function(){
  var qs=new URLSearchParams(location.search);
  var qp=normPhone(qs.get('c')||qs.get('phone')), qpin=normPin(qs.get('p')||qs.get('pin'));
  if(qp&&qpin){ $('iPhone').value=qp; $('iPin').value=qpin; doLogin(qp,qpin,true); return; }
  try{
    var s=JSON.parse(localStorage.getItem('gp_portal_login')||'null');
    if(s&&s.ph&&s.pin){ $('iPhone').value=s.ph; doLogin(s.ph,s.pin,false); }
  }catch(e){}
})();
</script>
</body>
</html>
